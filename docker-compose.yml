# Local/VM deployment stack for BUD (بُعد).
#
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bud}
      POSTGRES_DB: ${POSTGRES_DB:-bud}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["alembic", "upgrade", "head"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/app/static/uploads

  # Sends customer messages and runs reminders/renewals/follow-ups. Run exactly one.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["python", "-m", "app.automation.worker"]
    volumes:
      - uploads:/app/app/static/uploads

volumes:
  db_data:
  uploads:
