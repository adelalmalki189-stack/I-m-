<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B">
<title>BUD | العملاء</title>
<link rel="stylesheet" href="bud.css">
<style>.section-title{margin:16px 0 7px;font-size:11px;font-weight:700}.section-title:first-child{margin-top:0}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:10px;color:inherit;text-decoration:none}.line:last-child{border:0}.line .grow{flex:1}.line:hover .strong{color:var(--blue)}</style>
</head>
<body class="ui"><div class="app">
<aside class="side"></aside><script src="bud-shell.js"></script>
<main><header class="top"><div class="crumb"><a href="index.html">مركز العمليات</a> / <b>العملاء</b></div><div class="top-actions"><input id="search" class="search" type="search" placeholder="ابحث بالاسم أو الجوال أو البريد" aria-label="ابحث بالاسم أو الجوال أو البريد"></div></header>
<section class="page-head"><div><h1>ملفات العملاء</h1><p class="subtitle">كل عميل بطلباته ووثائقه ومطالباته في ملف واحد.</p></div></section>
<div id="error" class="notice error" hidden></div>
<div class="layout">
<section class="panel"><div class="panel-head"><div><h2>العملاء</h2><div class="muted">الأحدث أولًا</div></div><span id="count" class="muted"></span></div>
<div class="table-wrap"><table><thead><tr><th>العميل</th><th>الجوال</th><th>وثائق سارية</th><th>إجمالي الأقساط</th><th>أقرب انتهاء</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>لا يوجد عملاء.</div></div></section>
<section id="profile" class="panel" hidden><div class="panel-head"><div><h2 id="p-title"></h2><div id="p-sub" class="muted"></div></div></div>
<div class="panel-body">
<div class="section-title">بيانات التواصل</div>
<form id="contact" class="form-grid">
<label class="field"><span>الاسم</span><input name="full_name" required minlength="2"></label>
<label class="field"><span>المنشأة</span><input name="company_name"></label>
<label class="field"><span>الجوال</span><input name="phone" type="tel" dir="ltr"></label>
<label class="field"><span>البريد</span><input name="email" type="email" dir="ltr"></label>
<label class="field full"><span>ملاحظات</span><textarea name="notes" rows="2"></textarea></label>
<label class="field full" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="messaging_opt_out" style="width:auto;min-height:0"> <span>العميل لا يرغب في استلام رسائل واتساب/SMS</span></label>
<div class="full"><button class="button primary" type="submit">حفظ التعديلات</button></div>
</form>
<div class="section-title">الوثائق</div><div id="p-policies"></div>
<div class="section-title">الطلبات</div><div id="p-requests"></div>
<div class="section-title">المطالبات</div><div id="p-claims"></div>
<div class="section-title">الرسائل</div>
<form id="message-form" class="actions" style="margin-bottom:8px"><input name="text" class="search" style="flex:1;width:auto" required minlength="2" maxlength="1000" placeholder="اكتب رسالة للعميل (واتساب/SMS)"><button class="button primary" type="submit">إرسال</button></form>
<div id="p-messages"></div>
</div></section>
<section id="profile-empty" class="panel"><div class="empty">اختر عميلًا لعرض ملفه.</div></section>
</div></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="bud-api.js"></script>
<script>
const { api, el, pill, run, date, money, REQUEST_STATUS } = BUD;
const POLICY = { issued: 'صادرة', active: 'سارية', expired: 'منتهية', cancelled: 'ملغاة' };
const CLAIM = { reported: 'مُبلّغ عنها', submitted: 'أُرسلت للشركة', under_assessment: 'قيد التقييم', approved: 'معتمدة', rejected: 'مرفوضة', paid: 'مصروفة', closed: 'مغلقة' };
let customers = [], query = '', selectedId = new URLSearchParams(location.search).get('customer');
const contact = document.getElementById('contact');

function render() {
  const visible = customers.filter(c => `${c.display_name} ${c.full_name} ${c.phone || ''} ${c.email || ''}`.toLowerCase().includes(query));
  document.getElementById('rows').replaceChildren(...visible.map(c => el('tr', { class: `clickable${c.customer_id === selectedId ? ' selected' : ''}`, onclick: () => select(c.customer_id) },
    el('td', {}, el('div', { class: 'strong', text: c.display_name }), el('div', { class: 'sub', text: c.customer_type === 'business' ? `منشأة · ${c.full_name}` : 'فرد' })),
    el('td', { dir: 'ltr', style: 'text-align:right', text: c.phone || '—' }),
    el('td', {}, String(c.active_policies), c.open_claims ? el('span', { class: 'pill red', style: 'margin-right:6px', text: `${c.open_claims} مطالبة` }) : null),
    el('td', { text: money(c.total_premium) }),
    el('td', { class: 'muted', text: c.next_expiry ? date(c.next_expiry).split('،')[0] : '—' }))));
  document.getElementById('empty').hidden = visible.length > 0;
  document.getElementById('count').textContent = `${visible.length} عميل`;
}

const line = (href, title, sub, badge) => el(href ? 'a' : 'div', { class: 'line', href }, el('span', { class: 'grow' }, el('div', { class: 'strong', text: title }), el('div', { class: 'sub', text: sub })), badge);
const none = text => el('div', { class: 'muted', text });

async function select(id) {
  selectedId = id;
  history.replaceState(null, '', `?customer=${id}`);
  render();
  const p = await api(`/portfolio/customers/${id}`);
  const c = p.customer;
  document.getElementById('profile').hidden = false;
  document.getElementById('profile-empty').hidden = true;
  document.getElementById('p-title').textContent = c.display_name;
  document.getElementById('p-sub').textContent = `${c.requests_count} طلب · ${c.active_policies} وثيقة سارية · عميل منذ ${date(c.created_at).split('،')[0]}`;
  contact.full_name.value = c.full_name; contact.company_name.value = c.company_name || '';
  contact.phone.value = c.phone || ''; contact.email.value = c.email || ''; contact.notes.value = p.notes || ''; contact.messaging_opt_out.checked = c.messaging_opt_out;
  loadMessages(id);
  document.getElementById('p-policies').replaceChildren(...(p.policies.length ? p.policies.map(x => line(`policies.html?policy=${x.policy_id}`, `${x.policy_number} · ${x.insurance_type_label}`,
    `${x.insurer_name} · ${money(x.premium_amount)} · حتى ${date(x.effective_to).split('،')[0]}`, el('span', { class: 'pill', text: POLICY[x.effective_status] || x.effective_status }))) : [none('لا توجد وثائق')]));
  document.getElementById('p-requests').replaceChildren(...(p.requests.length ? p.requests.map(r => line(`requests.html?request=${r.request_id}`, r.request_number,
    `${r.insurance_type_label} · ${r.product_type_label} · ${date(r.created_at).split('،')[0]}`, pill(REQUEST_STATUS, r.status))) : [none('لا توجد طلبات')]));
  document.getElementById('p-claims').replaceChildren(...(p.claims.length ? p.claims.map(x => line(`claims.html?claim=${x.claim_id}`, x.claim_number,
    `${x.policy_number} · ${x.incident_date}`, el('span', { class: 'pill', text: CLAIM[x.status] }))) : [none('لا توجد مطالبات')]));
}

contact.addEventListener('submit', e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(contact));
  const body = { full_name: f.full_name.trim(), company_name: f.company_name.trim() || null, phone: f.phone.trim() || null, email: f.email.trim() || null, notes: f.notes.trim() || null, messaging_opt_out: contact.messaging_opt_out.checked };
  run(e.submitter, () => api(`/customers/${selectedId}`, { method: 'PATCH', body }), 'حُفظت بيانات العميل').then(async () => { await load(); await select(selectedId); });
});
const MSG_STATUS = { queued: ['بالانتظار', ''], sent: ['أُرسلت', 'blue'], simulated: ['تجريبية', ''], failed: ['فشلت', 'red'], skipped: ['لم تُرسل', 'red'] };
async function loadMessages(id) {
  const rows = await api(`/notifications?customer_id=${id}&limit=50`);
  document.getElementById('p-messages').replaceChildren(...(rows.length ? rows.map(m => line(null, m.kind_label, `${date(m.created_at)} · ${m.body.slice(0, 90)}${m.body.length > 90 ? '…' : ''}`,
    el('span', { class: `pill ${MSG_STATUS[m.status][1]}`, text: MSG_STATUS[m.status][0], title: m.last_error || '' }))) : [none('لا توجد رسائل')]));
}
document.getElementById('message-form').addEventListener('submit', e => {
  e.preventDefault();
  const form = e.currentTarget;
  run(e.submitter, () => api(`/customers/${selectedId}/messages`, { method: 'POST', body: { text: form.text.value.trim() } }), 'أُضيفت الرسالة لقائمة الإرسال')
    .then(() => { form.reset(); loadMessages(selectedId); });
});
document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
async function load() { customers = await api('/portfolio/customers'); render(); }
(async () => {
  try { await load(); if (selectedId) await select(selectedId); }
  catch (error) { const b = document.getElementById('error'); b.textContent = error.message; b.hidden = false; }
})();
</script>
</body></html>
