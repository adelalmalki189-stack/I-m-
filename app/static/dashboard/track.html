<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0B">
<title>BUD | تابع طلبك</title>
<link rel="stylesheet" href="bud.css">
<style>
body{font-size:14px}
.topbar{height:62px;padding:0 clamp(15px,4vw,48px);display:flex;align-items:center;justify-content:space-between;background:var(--black);color:var(--white)}
.topbar .brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gray);border-radius:8px;font-size:10px;font-weight:700}
.brand-name{font-size:16px;font-weight:700}.brand-name small{display:block;color:var(--pale);font-size:8px;font-weight:400}
.top-link{color:var(--pale);font-size:10px;text-decoration:none}
main{width:min(720px,calc(100% - 32px));margin:28px auto 45px;padding:0}
h1{margin:0 0 4px;font-size:22px}.lead{margin:0 0 16px;color:var(--muted);font-size:11px}
.card{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--white);margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0}
.step{padding:9px 6px;border-radius:6px;background:var(--pale);color:var(--muted);font-size:9px;text-align:center}
.step.done{background:#E3EAFF;color:var(--blue)}.step.current{background:var(--blue);color:var(--white);font-weight:600}
.message{font-size:12px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}.row:last-child{border:0}
.doc{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.doc:last-child{border:0}
.doc .notes{flex-basis:100%;margin:0;padding-inline-start:16px;color:#8A5A00;font-size:10px}.doc input{font-size:10px;max-width:220px}
.badge{padding:3px 8px;border-radius:10px;background:var(--pale);font-size:9px;white-space:nowrap}.badge.ok{background:#E3F4E8;color:#1E6B3A}.badge.bad{background:#FDEDEB;color:#B42318}.badge.wait{background:#FFF4D6;color:#8A5A00}
.letter{white-space:pre-line;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px;line-height:1.9}
.offer{padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}.offer:has(input:checked){border-color:var(--blue);background:#F3F6FF}
.offer.expired{opacity:.5;cursor:not-allowed}.offer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.offer-head b{font-size:13px}
.price{font-size:16px;font-weight:700;color:var(--blue)}.offer dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:11px}.offer dt{color:var(--muted)}
.rec{padding:2px 8px;border-radius:10px;background:var(--blue);color:var(--white);font-size:9px}
.sign-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;margin-top:12px}
.consent{display:flex;gap:8px;align-items:flex-start;margin:4px 0 12px;font-size:11px;line-height:1.7}
@media(max-width:560px){.steps{grid-template-columns:1fr}.step{text-align:right}.sign-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="ui">
<header class="topbar"><a class="brand" href="portal.html"><span class="brand-mark">BUD</span><span class="brand-name">بُعد<small>وساطة تأمينية رقمية</small></span></a><a class="top-link" href="portal.html">طلب تأمين جديد ←</a></header>
<main>
<h1>تابع طلبك</h1><p class="lead">أدخل رقم الطلب ورقم الجوال المسجل، وسنرسل لك رمز تحقق.</p>
<div id="error" class="notice error" hidden></div>
<section id="step-start" class="card"><form id="start-form" class="form-grid">
<label class="field"><span>رقم الطلب</span><input name="request_number" required placeholder="IR-20261014-XXXXXXXX" dir="ltr" autocomplete="off"></label>
<label class="field"><span>رقم الجوال</span><input name="mobile" type="tel" required placeholder="05xxxxxxxx" dir="ltr" autocomplete="tel"></label>
<div class="full"><button class="button primary" type="submit">إرسال رمز التحقق</button></div></form></section>
<section id="step-code" class="card" hidden><form id="code-form">
<p class="muted" style="margin-top:0">إذا كانت البيانات صحيحة ستصلك رسالة برمز من 6 أرقام خلال لحظات.</p>
<div id="dev-code" class="notice" hidden></div>
<label class="field"><span>رمز التحقق</span><input name="code" required inputmode="numeric" pattern="\d{6}" maxlength="6" dir="ltr" autocomplete="one-time-code"></label>
<div class="actions"><button class="button primary" type="submit">تحقق</button><button id="back" class="button" type="button">تعديل البيانات</button></div></form></section>
<section id="status" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="bud-api.js"></script>
<script>
const { el, money } = BUD;
const ERRORS = { INVALID_CODE: 'الرمز غير صحيح أو انتهت صلاحيته.', TOO_MANY_REQUESTS: 'محاولات كثيرة. حاول بعد عشر دقائق.', TRACKING_EXPIRED: 'انتهت الجلسة. اطلب رمزًا جديدًا.',
  NO_OFFERS_TO_ACCEPT: 'لا توجد عروض بانتظار اختيارك.', QUOTE_EXPIRED: 'انتهت صلاحية هذا العرض. تواصل مع بُعد لتجديده.', QUOTE_NOT_OFFERED: 'هذا العرض غير متاح.',
  NO_LETTER_TO_SIGN: 'لا يوجد خطاب بانتظار توقيعك.', LETTER_EXPIRED: 'انتهت صلاحية الخطاب. تواصل مع بُعد لإصدار خطاب جديد.', CONSENT_REQUIRED: 'أكّد موافقتك على نص الخطاب.',
  UNSUPPORTED_FILE_TYPE: 'نقبل PDF أو صور JPG/PNG (وجداول Excel للكشوف).', FILE_TOO_LARGE: 'حجم الملف أكبر من المسموح.', TOO_MANY_DOCUMENTS: 'وصلت للحد الأقصى من المستندات.' };
let lookup = null, token = null;  // kept in memory only, never stored in the browser

function showError(text) { const b = document.getElementById('error'); b.textContent = text || ''; b.hidden = !text; }
async function call(path, options = {}) {
  const response = await fetch(`/insurance/portal/track${path}`, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  const data = await response.json().catch(() => null);
  if (!response.ok) {
    const code = data?.detail?.error_code;
    throw new Error(ERRORS[code] || (Array.isArray(data?.detail) ? 'تحقق من رقم الطلب ورقم الجوال.' : 'تعذر إكمال الطلب.'));
  }
  return data;
}
const d = value => (value ? new Date(value).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn') : '—');

document.getElementById('start-form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.currentTarget;
  lookup = { request_number: f.request_number.value.trim(), mobile: f.mobile.value.trim() };
  showError('');
  try {
    const r = await call('/start', { method: 'POST', body: JSON.stringify(lookup) });
    document.getElementById('step-start').hidden = true;
    document.getElementById('step-code').hidden = false;
    const dev = document.getElementById('dev-code');
    dev.hidden = !r.dev_code; dev.textContent = r.dev_code ? `بيئة تطوير: الرمز ${r.dev_code}` : '';
    document.querySelector('#code-form [name=code]').focus();
  } catch (error) { showError(error.message); }
});
document.getElementById('back').addEventListener('click', () => { document.getElementById('step-code').hidden = true; document.getElementById('step-start').hidden = false; });
document.getElementById('code-form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('');
  try {
    token = (await call('/verify', { method: 'POST', body: JSON.stringify({ ...lookup, code: e.currentTarget.code.value.trim() }) })).token;
    await showStatus();
  } catch (error) { showError(error.message); }
});

async function showStatus() {
  const v = await call('', { headers: { 'X-Track-Token': token } });
  document.getElementById('step-code').hidden = true;
  const cards = [el('div', { class: 'card' },
    el('div', { class: 'muted', text: `${v.request_number} · ${v.line} · ${v.product} · قُدّم ${d(v.created_at)}` }),
    el('div', { class: 'steps' }, ...v.steps.map(s => el('div', { class: `step${s.done ? ' done' : ''}${s.current ? ' current' : ''}`, text: s.label }))),
    el('div', { class: 'message', text: v.message }),
    !v.policy && v.insurers_contacted ? el('p', { class: 'muted', text: `أرسلنا طلبك إلى ${v.insurers_contacted} شركة تأمين، ووصلنا ${v.quotes_received} عرض حتى الآن.` }) : null)];
  if (v.policy) {
    const p = v.policy;
    cards.push(el('div', { class: 'card' }, el('h2', { style: 'margin:0 0 8px;font-size:14px', text: 'وثيقتك' }),
      ...[['رقم الوثيقة', p.policy_number], ['شركة التأمين', p.insurer], ['المدة', `${d(p.effective_from)} — ${d(p.effective_to)}`], ['القسط', money(p.premium)]]
        .map(([k, val]) => el('div', { class: 'row' }, el('span', { class: 'muted', text: k }), el('b', { text: val }))),
      p.installments.length > 1 ? el('div', { style: 'margin-top:10px' }, el('div', { class: 'muted', text: 'الأقساط' }),
        ...p.installments.map(i => el('div', { class: 'row' }, el('span', { text: `#${i.sequence} · ${d(i.due_date)}` }), el('span', { text: money(i.amount) }),
          el('span', { class: `pill ${i.paid ? 'blue' : ''}`, text: i.paid ? 'مدفوع' : 'مستحق' })))) : null));
  }
  if (v.claims.length) {
    cards.push(el('div', { class: 'card' }, el('h2', { style: 'margin:0 0 8px;font-size:14px', text: 'مطالباتك' }),
      ...v.claims.map(c => el('div', { class: 'row' }, el('span', { text: `${c.claim_number} · ${d(c.incident_date)}` }), el('b', { text: c.status })))));
  }
  if (v.offers) cards.push(offersCard(v.offers));
  if (v.letter) cards.push(letterCard(v.letter));
  if (v.documents) cards.push(documentsCard(v.documents, v.documents_complete));
  cards.push(el('p', { class: 'muted', text: 'لأي استفسار تواصل مع فريق بُعد. تنتهي هذه الجلسة بعد 30 دقيقة.' }));
  const box = document.getElementById('status');
  box.replaceChildren(...cards); box.hidden = false;
}
function offersCard(o) {
  const card = el('div', { class: 'card' }, el('h2', { style: 'margin:0 0 6px;font-size:14px', text: 'عروض التأمين' }));
  if (o.status === 'accepted') {
    const q = o.quotes.find(x => x.quote_id === o.accepted_quote_id);
    card.append(el('p', { class: 'message', text: `✓ قبلتم عرض ${q?.insurer || ''} بقسط ${money(q?.premium)} في ${d(o.signed_at)}.` }),
      el('p', { class: 'muted', text: `رمز التحقق: ${o.verification_code}. نتواصل معكم لاستكمال السداد والإصدار.` }));
    return card;
  }
  if (o.note) card.append(el('div', { class: 'notice', style: 'margin-bottom:8px', text: o.note }));
  const form = el('form', {});
  form.append(...o.quotes.map(q => el('label', { class: `offer${q.expired ? ' expired' : ''}` },
    el('div', { class: 'offer-head' }, el('span', {}, el('input', { type: 'radio', name: 'quote_id', value: q.quote_id, required: true, disabled: q.expired }), ' ', el('b', { text: q.insurer })),
      q.quote_id === o.recommended_quote_id ? el('span', { class: 'rec', text: 'نوصي به' }) : null, el('span', { class: 'price', text: money(q.premium) })),
    el('dl', {}, ...[['حد التغطية', q.coverage_limit != null ? money(q.coverage_limit) : null], ['الشروط والتحمل', q.conditions], ['الاستثناءات', q.exclusions],
      ['صالح حتى', q.validity_date ? d(q.validity_date) : null]].filter(([, v]) => v).flatMap(([k, v]) => [el('dt', { text: k }), el('dd', { text: v })])),
    q.expired ? el('div', { class: 'muted', text: 'انتهت صلاحية هذا العرض' }) : null)),
    el('div', { class: 'sign-grid' },
      el('label', { class: 'field' }, el('span', { text: 'اسمك الكامل' }), el('input', { name: 'signer_name', required: true, minlength: 3, maxlength: 200 })),
      el('label', { class: 'field' }, el('span', { text: 'رقم الهوية أو الإقامة' }), el('input', { name: 'id_number', required: true, inputmode: 'numeric', pattern: '[12][0-9]{9}', maxlength: 10, dir: 'ltr' })),
      el('label', { class: 'field' }, el('span', { text: 'صفتك في المنشأة' }), el('input', { name: 'signer_title', required: true, minlength: 2, maxlength: 120 }))),
    el('label', { class: 'consent' }, el('input', { type: 'checkbox', name: 'accept', required: true }),
      el('span', { text: 'نقبل العرض المختار نيابة عن المنشأة، وأقرّ بأني مخوّل بالتوقيع عنها، وبأن هذا توقيعي الإلكتروني بعد التحقق من جوالي.' })),
    el('button', { class: 'button primary', type: 'submit', text: 'قبول العرض المختار' }));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    showError('');
    form.querySelector('[type=submit]').disabled = true;
    try {
      await call('/offers/accept', { method: 'POST', headers: { 'X-Track-Token': token }, body: JSON.stringify({ quote_id: form.quote_id.value,
        signer_name: form.signer_name.value.trim(), id_number: form.id_number.value.trim(), signer_title: form.signer_title.value.trim(), accept: form.accept.checked }) });
      await showStatus();
    } catch (error) { showError(error.message); form.querySelector('[type=submit]').disabled = false; }
  });
  const ask = el('form', { class: 'actions', style: 'margin-top:10px' }, el('input', { name: 'text', required: true, minlength: 2, maxlength: 1000, placeholder: 'لديك سؤال أو تريد تعديلًا قبل الاختيار؟', style: 'flex:1' }),
    el('button', { class: 'button', type: 'submit', text: 'إرسال' }));
  ask.addEventListener('submit', async e => {
    e.preventDefault();
    try { await call('/offers/comment', { method: 'POST', headers: { 'X-Track-Token': token }, body: JSON.stringify({ text: ask.text.value.trim() }) });
      ask.replaceChildren(el('span', { class: 'muted', text: 'وصلنا سؤالك، وسيرد عليك فريقنا.' })); } catch (error) { showError(error.message); }
  });
  card.append(el('p', { class: 'muted', style: 'margin:0 0 8px', text: 'اختر العرض المناسب لمنشأتك ووقّع القبول إلكترونيًا. القبول لا يعني الدفع الآن؛ نتواصل معكم لاستكمال السداد والإصدار.' }), form, ask);
  return card;
}

const TONE = { missing: 'bad', failed: 'bad', rejected: 'bad', warning: 'wait', pending_signature: 'wait', not_issued: '', passed: 'ok', accepted: 'ok', signed: 'ok' };

function letterCard(letter) {
  const card = el('div', { class: 'card' }, el('h2', { style: 'margin:0 0 8px;font-size:14px', text: 'خطاب التفويض' }));
  if (letter.status === 'signed') {
    card.append(el('p', { class: 'message', text: `✓ وقّعت الخطاب ${letter.letter_number} إلكترونيًا في ${d(letter.signed_at)}.` }),
      el('p', { class: 'muted', text: `رمز التحقق: ${letter.verification_code}. تستطيع شركات التأمين التحقق منه من صفحة التحقق في بُعد.` }),
      el('a', { class: 'button', href: `verify.html?code=${encodeURIComponent(letter.verification_code)}`, target: '_blank', rel: 'noopener', text: 'صفحة التحقق' }));
    return card;
  }
  const form = el('form', {},
    el('div', { class: 'sign-grid' },
      el('label', { class: 'field' }, el('span', { text: 'اسمك الكامل كما في الهوية' }), el('input', { name: 'signer_name', required: true, minlength: 3, maxlength: 200, autocomplete: 'name' })),
      el('label', { class: 'field' }, el('span', { text: 'رقم الهوية أو الإقامة' }), el('input', { name: 'id_number', required: true, inputmode: 'numeric', pattern: '[12][0-9]{9}', maxlength: 10, dir: 'ltr' })),
      el('label', { class: 'field' }, el('span', { text: 'صفتك في المنشأة' }), el('input', { name: 'signer_title', required: true, minlength: 2, maxlength: 120, placeholder: 'مثال: المدير العام' }))),
    el('label', { class: 'consent' }, el('input', { type: 'checkbox', name: 'accept', required: true }),
      el('span', { text: 'قرأت نص الخطاب وأوافق عليه نيابة عن المنشأة، وأقرّ بأني مخوّل بالتوقيع عنها وبأن هذا توقيعي الإلكتروني بعد التحقق من رقم جوالي.' })),
    el('button', { class: 'button primary', type: 'submit', text: 'توقيع الخطاب' }));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    showError('');
    form.querySelector('button').disabled = true;
    try {
      await call('/letter/sign', { method: 'POST', headers: { 'X-Track-Token': token }, body: JSON.stringify({
        signer_name: form.signer_name.value.trim(), id_number: form.id_number.value.trim(), signer_title: form.signer_title.value.trim(), accept: form.accept.checked }) });
      await showStatus();
    } catch (error) { showError(error.message); form.querySelector('button').disabled = false; }
  });
  card.append(el('p', { class: 'muted', text: 'يفوّض هذا الخطاب بُعد بطلب عروض الأسعار من شركات التأمين نيابة عن منشأتك. لا يُلزمها بأي وثيقة أو دفع.' }),
    el('div', { class: 'letter', text: letter.body_text }), form);
  return card;
}

async function upload(key, input) {
  const data = new FormData(); data.append('file', input.files[0]); data.append('document_type', key);
  showError('');
  input.disabled = true;
  try {
    const response = await fetch('/insurance/portal/track/documents', { method: 'POST', headers: { 'X-Track-Token': token }, body: data });
    const body = await response.json().catch(() => null);
    if (!response.ok) throw new Error(ERRORS[body?.detail?.error_code] || 'تعذر رفع الملف.');
    await showStatus();
  } catch (error) { showError(error.message); input.disabled = false; }
}

function documentsCard(items, complete) {
  const uploadable = items.filter(i => !i.generated);
  return el('div', { class: 'card' }, el('h2', { style: 'margin:0 0 4px;font-size:14px', text: 'مستندات طلبك' }),
    el('p', { class: 'muted', style: 'margin:0 0 6px', text: complete ? 'مستنداتك مكتملة، شكرًا لك.' : 'ارفع المستندات الناقصة أو استبدل ما عليه ملاحظة.' }),
    ...uploadable.map(i => el('div', { class: 'doc' },
      el('span', {}, el('b', { text: i.label }), i.required ? '' : el('span', { class: 'muted', text: ' (اختياري)' }), i.hint ? el('div', { class: 'muted', text: i.hint }) : null),
      el('span', { class: `badge ${TONE[i.status] || ''}`, text: i.status_label }),
      ['missing', 'failed', 'rejected', 'warning'].includes(i.status)
        ? el('input', { type: 'file', accept: i.spreadsheet ? '.pdf,.jpg,.jpeg,.png,.xlsx' : '.pdf,.jpg,.jpeg,.png', onchange: e => upload(i.key, e.currentTarget) }) : null,
      i.notes.length ? el('ul', { class: 'notes' }, ...i.notes.map(n => el('li', { text: n }))) : null)));
}

const number = new URLSearchParams(location.search).get('request');
if (number) document.querySelector('#start-form [name=request_number]').value = number;
</script>
</body></html>
